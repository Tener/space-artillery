[entity-description]
space-art-targeting-computer=Directs [entity=artillery-turret] on the same space platform to fire at asteroids matching its size, type, and sector rules.

[factoriopedia-description]
space-art-targeting-computer=Guides [entity=artillery-turret] on a space platform to lead moving asteroids and share targets without overkill. With several computers on a platform, every cannon fires at whatever any of them permits. Shots whose blast radius would hit [tile=space-platform-foundation] are held back. Direction, arc, near/far distance, minimum size, asteroid types, and an enable/disable signal can be overridden via the circuit network.
space-art-flash-hardened-steel=Cast in a [entity=foundry] from [fluid=molten-iron], [item=carbon], [item=calcite], and [item=ice]. Used to cast [item=space-art-steel-artillery-shell] and [item=space-art-promethium-artillery-shell].
space-art-steel-artillery-shell=Deals __1__ physical and __2__ explosion damage (compared to __3__ physical and __4__ explosion damage for [item=artillery-shell]). Huge asteroids have 3000 flat physical resistance.
space-art-promethium-artillery-shell=Deals __1__ physical and __2__ explosion damage (compared to __3__ physical and __4__ explosion damage for [item=artillery-shell]). Cast in a [entity=foundry] from [item=space-art-flash-hardened-steel] and [item=promethium-asteroid-chunk].
space-art-asteroid-ballistics=Destroy __1__ medium or larger standard asteroids with artillery. Kills in planet orbit count.
space-art-promethium-ballistics=Researched by destroying any medium, big or huge promethium asteroid ([entity=medium-promethium-asteroid] [entity=big-promethium-asteroid] [entity=huge-promethium-asteroid]).
space-art-artillery-rotation=Increases [entity=artillery-turret] rotation speed by +__1__% per level.
space-art-artillery-shell-velocity=Increases the flight velocity of [item=artillery-shell], [item=space-art-steel-artillery-shell], and [item=space-art-promethium-artillery-shell] by +__1__% per level.

[tips-and-tricks-item-name]
space-art-space-artillery=Space platform artillery
space-art-steel-artillery-shell=Steel artillery shells
space-art-promethium-artillery-shell=Promethium artillery shells

[tips-and-tricks-item-description]
space-art-space-artillery=[entity=artillery-turret] on a space platform automatically targets incoming asteroids when guided by a [entity=space-art-targeting-computer].\nShots lead moving asteroids and multiple turrets divide targets to avoid overkill.\nWith several computers on a platform, every cannon fires at whatever any of them permits.\nShots that would detonate near [tile=space-platform-foundation] are held back, and [entity=artillery-turret] cannot fire inside its 32-tile minimum range.\n[entity=space-art-targeting-computer] filters targets by asteroid size, chunk type, and directional sector, and can be controlled by the circuit network.
space-art-steel-artillery-shell=[item=space-art-steel-artillery-shell] can be cast in a [entity=foundry] from [item=space-art-flash-hardened-steel], [item=explosives], and [item=radar] without requiring [item=tungsten-plate].\nAll ingredients of [item=space-art-flash-hardened-steel] ([fluid=molten-iron], [item=carbon], [item=calcite], and [item=ice]) can be obtained from asteroids with [technology=advanced-asteroid-processing].\n[item=space-art-steel-artillery-shell] deals __1__ physical and __2__ explosion damage, compared to __3__ physical and __4__ explosion damage for [item=artillery-shell]. Huge asteroids have 3000 flat physical resistance.
space-art-promethium-artillery-shell=[item=space-art-promethium-artillery-shell] is cast in a [entity=foundry] from [item=space-art-flash-hardened-steel], [item=promethium-asteroid-chunk], [item=explosives], and [item=radar].\nIt deals __1__ physical and __2__ explosion damage, penetrating the 3000 flat physical resistance of huge asteroids at base damage research.

[mod-setting-name]
space-art-update-interval=Decoy update interval (ticks)
space-art-min-size=Smallest asteroid to target
space-art-max-shells=Most shells to spend on one asteroid
space-art-safety-margin=Hull safety margin (tiles)
space-art-require-computer=Artillery needs a targeting computer

[mod-setting-description]
space-art-max-shells=Asteroids needing more shells than this (with current damage research) are not targeted. Keeps huge asteroids off the list until research makes them worth it.
space-art-safety-margin=Extra distance, beyond the 4-tile blast, that a shell must land from any platform foundation.
space-art-require-computer=When on, a platform's artillery only engages asteroids allowed by a working targeting computer. When off, a platform without computers targets everything.
space-art-update-interval=How often each asteroid's decoy is moved to its new lead point. The work is spread over these ticks. Higher values cost less but aim worse at high platform speeds.
space-art-min-size=Asteroids smaller than this get no decoy, whatever the targeting computers allow.

[string-mod-setting]
space-art-min-size-small=Small
space-art-min-size-medium=Medium
space-art-min-size-big=Big
space-art-min-size-huge=Huge
