[technology-description]
space-art-targeting-computer=Allows [entity=artillery-turret] on a space platform to target asteroids when guided by a [entity=space-art-targeting-computer].
space-art-asteroid-ballistics=Ballistics data collected from artillery interceptions of standard asteroids.
space-art-steel-artillery-shell=Allows casting artillery shells in a [entity=foundry] from [item=space-art-flash-hardened-steel] instead of [item=tungsten-plate].
space-art-promethium-ballistics=Impact data from shattered promethium asteroids.
space-art-promethium-artillery-shell=Allows casting heavy armor-piercing artillery shells in a [entity=foundry] using [item=promethium-asteroid-chunk].
space-art-artillery-rotation=Increases the rotation speed of [entity=artillery-turret].
space-art-artillery-shell-velocity=Increases the flight speed of fired artillery shells.

