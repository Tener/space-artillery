[item-description]
space-art-flash-hardened-steel=Martensitic steel cast in a [entity=foundry] and quenched in [item=ice]. Used for artillery shell casings.
space-art-steel-artillery-shell=Artillery shell cased in [item=space-art-flash-hardened-steel]. Deals less physical damage than [item=artillery-shell].
space-art-promethium-artillery-shell=Heavy armor-piercing artillery shell cored with [item=promethium-asteroid-chunk]. Deals massive physical damage.

