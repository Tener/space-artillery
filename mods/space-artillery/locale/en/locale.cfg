[technology-description]
space-art-targeting-computer=Allows [entity=artillery-turret] on a space platform to target asteroids when guided by a [entity=space-art-targeting-computer].
space-art-asteroid-ballistics=Destroy __1__ medium or larger standard asteroids with artillery.
space-art-steel-artillery-shell=Allows casting artillery shells in a [entity=foundry] from [item=space-art-flash-hardened-steel] instead of [item=tungsten-plate].
space-art-promethium-ballistics=Impact data from shattered promethium asteroids.
space-art-promethium-artillery-shell=Allows casting heavy armor-piercing artillery shells in a [entity=foundry] using [item=promethium-asteroid-chunk].
space-art-artillery-rotation=Increases the rotation speed of [entity=artillery-turret].
space-art-artillery-shell-velocity=Increases the flight speed of fired artillery shells.

[technology-trigger]
space-art-promethium-ballistics=Destroy a medium or larger promethium asteroid.

[technology-effect]
space-art-asteroid-ballistics=Unlocks research into [technology=space-art-steel-artillery-shell]
space-art-promethium-ballistics=Unlocks research into [technology=space-art-promethium-artillery-shell]
space-art-artillery-rotation=Artillery turret rotation speed: +__1__%
space-art-artillery-shell-velocity=Artillery shell flight velocity: +__1__%

[entity-description]
space-art-targeting-computer=Directs [entity=artillery-turret] on the same space platform to fire at asteroids matching its size, type, and sector rules.

[factoriopedia-description]
space-art-targeting-computer=Any working targeting computer on a platform can permit a shot. Artillery holds fire if the blast would hit [tile=space-platform-foundation].
space-art-flash-hardened-steel=Cast in a [entity=foundry] from [fluid=molten-iron], [item=carbon], [item=calcite], and [item=ice]. Used to cast [item=space-art-steel-artillery-shell] and [item=space-art-promethium-artillery-shell].
space-art-steel-artillery-shell=Deals __1__ physical and __2__ explosion damage (compared to __3__ physical and __4__ explosion damage for [item=artillery-shell]). Huge asteroids have 3000 flat physical resistance.
space-art-promethium-artillery-shell=Deals __1__ physical and __2__ explosion damage (compared to __3__ physical and __4__ explosion damage for [item=artillery-shell]). Cast in a [entity=foundry] from [item=space-art-flash-hardened-steel] and [item=promethium-asteroid-chunk].
space-art-asteroid-ballistics=Destroy __1__ medium or larger standard asteroids with artillery. Kills in planet orbit count.
space-art-promethium-ballistics=Destroy a medium or larger promethium asteroid.
space-art-artillery-rotation=Increases [entity=artillery-turret] rotation speed by +__1__% per level.
space-art-artillery-shell-velocity=Increases the flight velocity of [item=artillery-shell], [item=space-art-steel-artillery-shell], and [item=space-art-promethium-artillery-shell] by +__1__% per level.

[tips-and-tricks-item-name]
space-art-space-artillery=Space platform artillery
space-art-steel-artillery-shell=Steel artillery shells
space-art-promethium-artillery-shell=Promethium artillery shells

[tips-and-tricks-item-description]
space-art-space-artillery=Place a [entity=space-art-targeting-computer] on a space platform to guide [entity=artillery-turret]. Filter targets by size, chunk type, and firing sector, or control the filters with circuit signals.\nCannons lead moving targets and share fire. They keep their 32-tile minimum range and hold shots that would hit the hull.
space-art-steel-artillery-shell=Cast [item=space-art-steel-artillery-shell] onboard without [item=tungsten-plate]. The steel can be made from collected asteroids.
space-art-promethium-artillery-shell=Use [item=space-art-promethium-artillery-shell] to pierce huge asteroid armor at base damage.

[mod-setting-name]
space-art-update-interval=Targeting update interval (ticks)
space-art-min-size=Smallest asteroid to target
space-art-max-shells=Maximum shells per target
space-art-safety-margin=Hull safety margin (tiles)
space-art-require-computer=Artillery needs a targeting computer

[mod-setting-description]
space-art-max-shells=Artillery skips asteroids that need more shells than this at current damage.
space-art-safety-margin=Extra distance, beyond the 4-tile blast, that a shell must land from any platform foundation.
space-art-require-computer=When on, a platform's artillery only engages asteroids allowed by a working targeting computer. When off, a platform without computers targets everything.
space-art-update-interval=Ticks between updates to an asteroid's aim point. Higher values reduce CPU use. Fast platforms need more frequent updates.
space-art-min-size=Artillery skips smaller asteroids even when a targeting computer allows them.

[string-mod-setting]
space-art-min-size-small=Small
space-art-min-size-medium=Medium
space-art-min-size-big=Big
space-art-min-size-huge=Huge
