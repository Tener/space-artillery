[technology-description]
awe-art-targeting-computer=Allows [entity=artillery-turret] on a space platform to target asteroids when guided by a [entity=awe-art-targeting-computer].
awe-art-asteroid-ballistics=Ballistic firing data collected against metallic, carbonic, and oxide asteroids.
awe-art-steel-artillery-shell=Allows casting artillery shells in a [entity=foundry] from [item=awe-art-flash-hardened-steel] instead of [item=tungsten-plate].
awe-art-promethium-ballistics=Impact data from shattered promethium asteroids.
awe-art-promethium-artillery-shell=Allows casting heavy armor-piercing artillery shells in a [entity=foundry] using [item=promethium-asteroid-chunk].
awe-art-artillery-rotation=Increases the rotation speed of [entity=artillery-turret].
awe-art-artillery-shell-velocity=Increases the flight speed of fired artillery shells.

[technology-trigger]
awe-art-asteroid-ballistics=Destroy __1__ medium, big or huge metallic, carbonic or oxide asteroids ([entity=medium-metallic-asteroid] [entity=medium-carbonic-asteroid] [entity=medium-oxide-asteroid]) with artillery.
awe-art-promethium-ballistics=Destroy any medium, big or huge promethium asteroid ([entity=medium-promethium-asteroid] [entity=big-promethium-asteroid] [entity=huge-promethium-asteroid]).

