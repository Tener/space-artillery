space-art-asteroid-ballistics=Destroy __1__ medium or larger standard asteroids with artillery.
space-art-promethium-ballistics=Destroy any medium, big or huge promethium asteroid ([entity=medium-promethium-asteroid] [entity=big-promethium-asteroid] [entity=huge-promethium-asteroid]).

