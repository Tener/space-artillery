[technology-description]
aa-targeting-computer=Lets space platform artillery shoot asteroids. The targeting computer picks which asteroids, and where.
aa-asteroid-ballistics=Gather live firing data against metallic, carbonic and oxide asteroids in space to unlock orbital munition designs.
aa-steel-artillery-shell=Manufacture artillery shells in space using flash-hardened steel instead of Vulcanus tungsten.
aa-promethium-ballistics=Analyze the extreme density of shattered promethium asteroids to design ultra-heavy kinetic penetrators.
aa-promethium-artillery-shell=Manufacture heavy armor-piercing artillery shells using promethium asteroid chunks to crack huge deep-space asteroids.
aa-artillery-rotation=Increases the turning speed of artillery turrets on platforms and on the ground.
aa-artillery-shell-velocity=Increases the flight velocity of fired artillery shells, reducing time-to-target against moving asteroids.

[technology-trigger]
aa-asteroid-ballistics=Destroy 500 medium or larger metallic, carbonic and oxide asteroids ([asteroid-chunk=metallic-asteroid-chunk] [asteroid-chunk=carbonic-asteroid-chunk] [asteroid-chunk=oxide-asteroid-chunk]) with artillery.
aa-promethium-ballistics=Destroy any promethium asteroid ([entity=medium-promethium-asteroid] [entity=big-promethium-asteroid] [entity=huge-promethium-asteroid]).

[technology-effect]
aa-asteroid-ballistics=Unlocks research into space-manufactured artillery shells
aa-promethium-ballistics=Unlocks research into promethium armor-piercing artillery shells
aa-artillery-rotation=Artillery turret rotation speed: +__1__%
aa-artillery-shell-velocity=Artillery shell flight velocity: +__1__%

[entity-description]
aa-targeting-computer=Directs the platform's artillery at asteroids matching its size, type and sector rules. Needs power. Circuit signals can override its settings.

[factoriopedia-description]
aa-targeting-computer=Artillery on a space platform leads moving asteroids, avoids overkill across turrets, and holds fire where splash would hit [tile=space-platform-foundation]. With multiple computers on one platform, an asteroid is engaged if any powered computer allows it. Direction, arc, near/far distance, minimum size, asteroid types and a switch-off signal can all be controlled via the circuit network.
aa-flash-hardened-steel=Produced entirely from asteroid resources unlocked by [technology=advanced-asteroid-processing]: [item=steel-plate] from metallic chunks, [item=carbon] from carbonic chunks, and [item=calcite] + [item=ice] from oxide chunks. Used to case both [item=aa-steel-artillery-shell] and [item=aa-promethium-artillery-shell].
aa-steel-artillery-shell=Deals 200 physical and 800 explosion damage (vs. 1000 + 1000 for [item=artillery-shell]). Matches tungsten shells at base research against small, medium and big asteroids, but scales more slowly with damage research and cannot penetrate huge asteroids' 3000 flat physical resistance.
aa-promethium-artillery-shell=Deals 4000 physical and 1000 explosion damage. Crafted in space from [item=aa-flash-hardened-steel] and [item=promethium-asteroid-chunk], its massive kinetic punch immediately pierces huge asteroids' 3000 flat physical armor and one-shots big asteroids even at base damage research.
aa-asteroid-ballistics=Unlocked automatically by destroying 500 medium or larger metallic, carbonic and oxide asteroids with platform artillery. Opens research into [technology=aa-steel-artillery-shell].
aa-promethium-ballistics=Unlocked automatically by destroying any promethium asteroid ([entity=medium-promethium-asteroid] [entity=big-promethium-asteroid] [entity=huge-promethium-asteroid]). Opens research into [technology=aa-promethium-artillery-shell].
aa-artillery-rotation=Upgrades [entity=artillery-turret] traverse speed by +30% per level (up to +300% at level 10), letting turrets swing rapidly across wide targeting sectors.
aa-artillery-shell-velocity=Infinite upgrade that increases the flight velocity of all fired artillery shells ([item=artillery-shell], [item=aa-steel-artillery-shell], [item=aa-promethium-artillery-shell]) by +20% per level.

[tips-and-tricks-item-name]
aa-space-artillery=Space platform artillery
aa-steel-artillery-shell=Steel artillery shells
aa-promethium-artillery-shell=Promethium artillery shells

[tips-and-tricks-item-description]
aa-space-artillery=[entity=artillery-turret] on a space platform automatically engages incoming asteroids when guided by a [entity=aa-targeting-computer].\n\n- [font=default-bold]Leading & overkill:[/font] Shots lead the asteroid's flight path, and multiple turrets share targets without wasting shells.\n- [font=default-bold]Hull safety:[/font] Shots that would detonate near [tile=space-platform-foundation] are held back. Because artillery also has a 32-tile minimum range, keep close-in turrets ([entity=gun-turret], [entity=rocket-turret]) to finish asteroids that slip inside.\n- [font=default-bold]Targeting computer:[/font] Filters targets by size, asteroid chunk type and a directional sector zone, with optional circuit-network overrides.\n- [font=default-bold]Upgrades:[/font] Research [technology=aa-artillery-rotation-1], [technology=aa-artillery-shell-velocity-1] and artillery damage to track faster and hit harder.
aa-steel-artillery-shell=[item=artillery-shell] requires [item=tungsten-plate] imported from [planet=vulcanus]. Self-sufficient platforms can instead craft [item=aa-steel-artillery-shell] in space from [item=aa-flash-hardened-steel].\n\n- [font=default-bold]Space production:[/font] With [technology=advanced-asteroid-processing], all ingredients come from the three asteroid types: [item=steel-plate] and [item=copper-plate] (metallic), [item=carbon] and [item=explosives] (carbonic), and [item=calcite] + [item=ice] (oxide).\n- [font=default-bold]Combat trade-off:[/font] [item=aa-steel-artillery-shell] deals 200 physical + 800 explosion damage instead of 1000 + 1000. It kills small, medium and big asteroids effectively, while huge deep-space asteroids require tungsten [item=artillery-shell] (with high damage research) or [item=aa-promethium-artillery-shell].
aa-promethium-artillery-shell=Deep-space platforms harvesting [item=promethium-asteroid-chunk] can manufacture [item=aa-promethium-artillery-shell] on board using [item=aa-flash-hardened-steel].\n\n- [font=default-bold]Armor-piercing punch:[/font] Deals 4000 physical + 1000 explosion damage, punching straight through huge asteroids' 3000 flat physical resistance even at base damage research and one-shotting big asteroids.\n- [font=default-bold]Deep-space sustain:[/font] Combines local [item=aa-flash-hardened-steel], [item=explosives] and [item=radar] with a single [item=promethium-asteroid-chunk] per shell.

[mod-setting-name]
aa-update-interval=Decoy update interval (ticks)
aa-min-size=Smallest asteroid to target
aa-max-shells=Most shells to spend on one asteroid
aa-safety-margin=Hull safety margin (tiles)
aa-require-computer=Artillery needs a targeting computer

[mod-setting-description]
aa-max-shells=Asteroids needing more shells than this (with current damage research) are not targeted. Keeps huge asteroids off the list until research makes them worth it.
aa-safety-margin=Extra distance, beyond the 4-tile blast, that a shell must land from any platform foundation.
aa-require-computer=When on, a platform's artillery only engages asteroids allowed by a working targeting computer. When off, a platform without computers targets everything.
aa-update-interval=How often each asteroid's decoy is moved to its new lead point. The work is spread over these ticks. Higher values cost less but aim worse at high platform speeds.
aa-min-size=Asteroids smaller than this get no decoy, whatever the targeting computers allow.

