[entity-description]
aa-targeting-computer=Tells the platform's artillery which asteroids to shoot, and where. Needs power. Circuit signals override its settings.

[mod-setting-name]
aa-rotation-multiplier=Artillery turret rotation speed multiplier
aa-shell-speed-multiplier=Artillery shell speed multiplier
aa-fire-rate-multiplier=Artillery fire rate multiplier
aa-update-interval=Decoy update interval (ticks)
aa-min-size=Smallest asteroid to target
aa-max-shells=Most shells to spend on one asteroid
aa-safety-margin=Hull safety margin (tiles)
aa-require-computer=Artillery needs a targeting computer

[mod-setting-description]
aa-rotation-multiplier=Applies to all artillery turrets, ground included.
aa-shell-speed-multiplier=Applies to all artillery shells, ground included.
aa-fire-rate-multiplier=Applies to all artillery guns (turrets and wagons), on top of fire-rate research.
aa-max-shells=Asteroids needing more shells than this (with current damage research) are not targeted. Keeps huge asteroids off the list until research makes them worth it.
aa-safety-margin=Extra distance, beyond the 4-tile blast, that a shell must land from any platform foundation.
aa-require-computer=When on, a platform's artillery only engages asteroids allowed by a working targeting computer. When off, a platform without computers targets everything.
